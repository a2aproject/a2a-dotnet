name: ACTS PR reporting

on:
  pull_request:
    paths:
      - '.github/scripts/acts-pr-comment*'
      - '.github/workflows/acts-pr-comment.yaml'
      - '.github/workflows/acts.yaml'
  workflow_run:
    workflows: [ACTS]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    name: Test ACTS PR reporting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/acts-pr-comment.test.cjs

  comment:
    name: Report ACTS advisory findings
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: acts-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # This privileged job executes only default-branch code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download reports from the completed ACTS run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acts-reports-dotnet-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/acts-reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Update advisory PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { join } = require('node:path');
            const { publishComment } = require('./.github/scripts/acts-pr-comment.cjs');
            await publishComment({
              github, context, core,
              reportDirectory: join(process.env.RUNNER_TEMP, 'acts-reports'),
            });
