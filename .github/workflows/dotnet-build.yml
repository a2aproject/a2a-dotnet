# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET  
on:    
  push:      
    branches: [ "main" ]    
  pull_request:      
    branches: [ "main" ]  
  workflow_dispatch:
  
jobs:
  buildLibs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet-version: 8.x
            framework: net8.0
          - dotnet-version: 10.x
            framework: net10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore dependencies
        run: dotnet restore
      - name: BuildLibs
        run: dotnet build ./src/A2ALibs.slnx --framework ${{ matrix.framework }}
      - name: TestLibs
        run: dotnet test ./src/A2ALibs.slnx --no-build --verbosity normal --framework ${{ matrix.framework }}
      - name: BuildGrpcTests
        run: dotnet build ./tests/A2A.Grpc.UnitTests/A2A.Grpc.UnitTests.csproj --framework ${{ matrix.framework }}
      - name: TestGrpc
        run: dotnet test ./tests/A2A.Grpc.UnitTests/A2A.Grpc.UnitTests.csproj --no-build --verbosity normal --framework ${{ matrix.framework }}
  buildSamples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: BuildLibs
        run: dotnet build --framework net10.0
      - name: TestLibs
        run: dotnet test --no-build --verbosity normal --framework net10.0
  nativeAot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - name: Publish Native AOT validation
        run: dotnet publish ./tests/A2A.AotTests/A2A.AotTests.csproj --configuration Release --runtime linux-x64
      - name: Run Native AOT validation
        run: ./tests/A2A.AotTests/bin/Release/net10.0/linux-x64/publish/A2A.AotTests
