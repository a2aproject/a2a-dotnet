name: Nightly ITK

on:
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC daily (before 4 AM dashboard refresh)
  workflow_dispatch:      # Allow manual execution

permissions:
  contents: write

concurrency:
  group: itk-nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly ITK Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone a2a-itk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: a2aproject/a2a-itk
          ref: b57c5332aa883b27c1e5c915fe61cac76d2a1de9 # main, 2026-09-30
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      # Also holds the NuGet package cache the in-container `dotnet publish`
      # writes to, which is what keeps the agent's build inside the readiness
      # window on a warm runner.
      - name: Cache launcher checkouts and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run Nightly ITK Tests
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: b57c5332aa883b27c1e5c915fe61cac76d2a1de9
          ITK_NIGHTLY_RUN: "True"
          ITK_SKIP_BUILD: "1"

      - name: Upload Results to Rolling Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "nightly-metrics"
          prerelease: true
          files: |
            itk/itk_dotnet.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
