name: ACTS

# Conformance suite, run against this SDK as the agent under test. The
# traversal counterpart is `itk.yaml`; both drive the same `itk/run_itk.sh`,
# and ITK_ACTS_RUN picks which suite it runs.
#
# Run all three standard protocol bindings exposed by the ITK agent.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'itk/**'
      - 'acts/**'
      - '.github/workflows/acts.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acts:
    name: ACTS Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone a2a-itk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: a2aproject/a2a-itk
          ref: b57c5332aa883b27c1e5c915fe61cac76d2a1de9 # main, 2026-09-30
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      # Also holds the NuGet package cache the in-container `dotnet publish`
      # writes to, which is what keeps the agent's build inside the readiness
      # window on a warm runner.
      - name: Cache launcher checkouts and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run ACTS Conformance Suite
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: b57c5332aa883b27c1e5c915fe61cac76d2a1de9
          ITK_ACTS_RUN: "1"
          ITK_ACTS_TRANSPORTS: jsonrpc,rest,grpc
          ITK_SKIP_BUILD: "1"

      - name: Publish ACTS summary
        if: always()
        working-directory: itk
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import pathlib
          import sys

          expected = {"jsonrpc", "rest", "grpc"}
          reports = {}
          for name in glob.glob("acts-report-*.json"):
              with open(name, encoding="utf-8") as stream:
                  report = json.load(stream)
              transport = report["transport"]
              if transport in reports:
                  raise SystemExit(f"duplicate ACTS report for {transport}")
              reports[transport] = report

          if set(reports) != expected:
              raise SystemExit(
                  f"expected ACTS reports for {sorted(expected)}, got {sorted(reports)}"
              )

          lines = [
              "## ACTS conformance",
              "",
              "| Transport | Conformant | MUST passed | MUST failed | MUST skipped | Total failed |",
              "|---|---:|---:|---:|---:|---:|",
          ]
          for transport in sorted(reports):
              report = reports[transport]
              summary = report["summary"]
              must = summary["by_level"]["must"]
              conformant = must["failed"] == 0 and must["errors"] == 0
              lines.append(
                  f"| {transport} | {'yes' if conformant else 'no'} | "
                  f"{must['passed']} | {must['failed']} | {must['skipped']} | "
                  f"{summary['failed']} |"
              )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              pathlib.Path(summary_path).open("a", encoding="utf-8").write(
                  "\n".join(lines) + "\n"
              )
          else:
              print("\n".join(lines))
          PY

      - name: Upload ACTS reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acts-reports-dotnet
          path: itk/acts-report-*.json
          if-no-files-found: warn
          retention-days: 14
