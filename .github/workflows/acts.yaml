name: ACTS

# Conformance suite, run against this SDK as the agent under test. The
# traversal counterpart is `itk.yaml`; both drive the same `itk/run_itk.sh`,
# and ITK_ACTS_RUN picks which suite it runs.
#
# Two bindings, not three: the SDK has no gRPC server — A2AClientFactory
# knows the GRPC binding name but nothing implements it — so a gRPC pass
# would have nothing to dial.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'itk/**'
      - 'acts/**'
      - '.github/workflows/acts.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acts:
    name: ACTS Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Clone a2a-itk
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      # Also holds the NuGet package cache the in-container `dotnet publish`
      # writes to, which is what keeps the agent's build inside the readiness
      # window on a warm runner.
      - name: Cache launcher checkouts and build outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run ACTS Conformance Suite
        # Temporarily advisory: the driver gates on `must` conformance here,
        # which this SDK does not pass yet. Delete this line to make it a
        # merge requirement.
        continue-on-error: true
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: main
          ITK_ACTS_RUN: "1"
          ITK_ACTS_TRANSPORTS: jsonrpc,rest
          ITK_SKIP_BUILD: "1"

      - name: Upload ACTS reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acts-reports-dotnet
          path: itk/acts-report-*.json
          if-no-files-found: warn
          retention-days: 14
